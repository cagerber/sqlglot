[project]
name = "sqlglot"
version = "30.11.0+trifour.1"
dynamic = ["optional-dependencies"]
description = "An easily customizable SQL parser and transpiler"
readme = "README.md"
authors = [{ name = "Toby Mao", email = "toby.mao@gmail.com" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">= 3.9"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: SQL",
    "Programming Language :: Python :: 3 :: Only",
]

[project.urls]
Homepage = "https://sqlglot.com/"
Documentation = "https://sqlglot.com/sqlglot.html"
Repository = "https://github.com/tobymao/sqlglot"
Issues = "https://github.com/tobymao/sqlglot/issues"

[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = false

# Upstream uses setuptools-scm; Trifour fork pins explicit PEP 440 versions:
#   <upstream-release>+trifour.<n>  — bump upstream part when merging releases; bump +trifour on fork-only commits.

[tool.setuptools.packages.find]
include = ["sqlglot", "sqlglot.*"]

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.uv.sources]
sqlglotc = { path = "./sqlglotc" }

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["UP"]
ignore = ["E721", "E741"]
